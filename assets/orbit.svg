<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Tech orbit: Flutter, React Native, TypeScript, Next.js, Node.js and Golang revolving around a performance-obsessed core">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#312066"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .l{font-family:'Consolas','SF Mono',ui-monospace,monospace;}
      .pulse{animation:p 3s ease-in-out infinite;}
      @keyframes p{0%,100%{r:36px;opacity:1}50%{r:40px;opacity:.85}}
      @keyframes haloP{0%,100%{opacity:.55}50%{opacity:.9}}
      .halo{animation:haloP 3s ease-in-out infinite;}
    </style>
  </defs>

  <rect width="940" height="300" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="938" height="298" rx="15" fill="none" stroke="#21262d"/>
  <text class="l" x="24" y="32" font-size="13" letter-spacing="3" fill="#8B949E">THE&#160;STACK&#160;//&#160;IN&#160;ORBIT</text>

  <g transform="translate(470,158)">
    <!-- orbit rings -->
    <ellipse cx="0" cy="0" rx="150" ry="72"  fill="none" stroke="#A78BFA" stroke-opacity="0.20"/>
    <ellipse cx="0" cy="0" rx="260" ry="106" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
    <ellipse cx="0" cy="0" rx="370" ry="120" fill="none" stroke="#EC4899" stroke-opacity="0.12"/>

    <!-- core -->
    <circle class="halo" cx="0" cy="0" r="70" fill="url(#halo)" filter="url(#b)"/>
    <circle class="pulse" cx="0" cy="0" r="36" fill="url(#core)"/>
    <text class="l" x="0" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">PERFORMANCE</text>
    <text class="l" x="0" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">OBSESSED</text>

    <!-- ring 1 : mobile -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(150,0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#02569B" stroke-width="2"/>
        <text class="l" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#5CC8F7">Flutter</text>
      </g>
      <g transform="translate(-150,0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#61DAFB" stroke-width="2"/>
        <text class="l" y="1" text-anchor="middle" font-size="9" font-weight="700" fill="#61DAFB">React</text>
        <text class="l" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#61DAFB">Native</text>
      </g>
    </g>

    <!-- ring 2 : front-end -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="60" to="-300" dur="22s" repeatCount="indefinite"/>
      <g transform="translate(260,0)">
        <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="22s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#3178C6" stroke-width="2"/>
        <text class="l" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#6BA8E8">TS</text>
      </g>
      <g transform="translate(-260,0)">
        <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="22s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
        <text class="l" y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#E6EDF3">Next</text>
      </g>
    </g>

    <!-- ring 3 : back-end -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="30s" repeatCount="indefinite"/>
      <g transform="translate(370,0)">
        <animateTransform attributeName="transform" type="rotate" from="-120" to="-480" dur="30s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#339933" stroke-width="2"/>
        <text class="l" y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#62C462">Node</text>
      </g>
      <g transform="translate(-370,0)">
        <animateTransform attributeName="transform" type="rotate" from="-120" to="-480" dur="30s" repeatCount="indefinite"/>
        <circle r="22" fill="#0f1320" stroke="#00ADD8" stroke-width="2"/>
        <text class="l" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#3DD6F0">Go</text>
      </g>
    </g>
  </g>

  <!-- legend -->
  <g class="l" font-size="11" fill="#8B949E">
    <circle cx="34" cy="282" r="4" fill="#02569B"/><text x="44" y="286">mobile</text>
    <circle cx="120" cy="282" r="4" fill="#3178C6"/><text x="130" y="286">front-end</text>
    <circle cx="218" cy="282" r="4" fill="#00ADD8"/><text x="228" y="286">back-end</text>
    <text x="690" y="286" fill="#6E7681">+ PHP · Dart · Swift · Lit · Oracle SQL</text>
  </g>
</svg>
