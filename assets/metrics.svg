<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="940" height="220" role="img" aria-label="Impact metrics: plus 30 percent sales volume, minus 91 percent infrastructure cost, plus 50 percent ROI">
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="cg" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <style>
      .t{font-family:'Segoe UI',Verdana,Arial,sans-serif;font-weight:800;}
      .l{font-family:'Consolas','SF Mono',ui-monospace,monospace;}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .card{animation:rise .8s cubic-bezier(.2,.7,.3,1) both;}
      .c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}
      @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
      .dot{animation:blink 1.6s ease-in-out infinite;}
    </style>
  </defs>

  <rect width="940" height="220" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="938" height="218" rx="15" fill="none" stroke="#21262d"/>
  <text class="l" x="24" y="34" font-size="13" letter-spacing="3" fill="#8B949E">REAL&#160;OUTCOMES&#160;//&#160;SHIPPED</text>
  <circle class="dot" cx="212" cy="30" r="3" fill="#22D3EE"/>

  <!-- CARD 1 : +30% sales (arc fills to 30% of 213.6 circumference) -->
  <g transform="translate(24,58)"><g class="card c1">
    <rect width="282" height="140" rx="14" fill="#0f1320" stroke="#7C3AED" stroke-opacity="0.45"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="#1b2030" stroke-width="8"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="url(#gv)" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90 232 50)">
      <animate attributeName="stroke-dashoffset" from="213.6" to="149.5" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    </circle>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gv)" filter="url(#cg)">+30%</text>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gv)">+30%</text>
    <text class="l" x="22" y="88" font-size="13" fill="#C9D1D9" font-weight="700">SALES VOLUME</text>
    <text class="l" x="22" y="108" font-size="11" fill="#8B949E">Oráculo event strategy</text>
    <text class="l" x="22" y="124" font-size="11" fill="#8B949E">Assiny checkout</text>
  </g></g>

  <!-- CARD 2 : -91% cost (arc fills to 91% of 213.6 circumference) -->
  <g transform="translate(329,58)"><g class="card c2">
    <rect width="282" height="140" rx="14" fill="#0f1320" stroke="#EC4899" stroke-opacity="0.45"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="#1b2030" stroke-width="8"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="url(#gp)" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90 232 50)">
      <animate attributeName="stroke-dashoffset" from="213.6" to="19.2" dur="1.4s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    </circle>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gp)" filter="url(#cg)">&#8722;91%</text>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gp)">&#8722;91%</text>
    <text class="l" x="22" y="88" font-size="13" fill="#C9D1D9" font-weight="700">INFRA COST</text>
    <text class="l" x="22" y="108" font-size="11" fill="#8B949E">US$430 &#8594; US$40 / mo</text>
    <text class="l" x="22" y="124" font-size="11" fill="#8B949E">Gymatch re-architecture</text>
  </g></g>

  <!-- CARD 3 : +50% ROI (arc fills to 50% of 213.6 circumference) -->
  <g transform="translate(634,58)"><g class="card c3">
    <rect width="282" height="140" rx="14" fill="#0f1320" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="#1b2030" stroke-width="8"/>
    <circle cx="232" cy="50" r="34" fill="none" stroke="url(#gc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90 232 50)">
      <animate attributeName="stroke-dashoffset" from="213.6" to="106.8" dur="1.4s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    </circle>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gc)" filter="url(#cg)">+50%</text>
    <text class="t" x="22" y="58" font-size="40" fill="url(#gc)">+50%</text>
    <text class="l" x="22" y="88" font-size="13" fill="#C9D1D9" font-weight="700">ROI</text>
    <text class="l" x="22" y="108" font-size="11" fill="#8B949E">RN &#8594; Flutter migration</text>
    <text class="l" x="22" y="124" font-size="11" fill="#8B949E">led end-to-end</text>
  </g></g>
</svg>
