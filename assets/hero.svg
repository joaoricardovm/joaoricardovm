<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="João Ricardo Rezende Vaz de Mello — Software Engineer, Mobile and Full Stack. I don't ship features, I ship business outcomes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#120a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .nm{font-family:'Segoe UI',Verdana,Arial,sans-serif;font-weight:800;}
      .sub{font-family:'Consolas','SF Mono',ui-monospace,monospace;}
      .star{animation:tw 3s ease-in-out infinite;}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-26px)}}
      .float{animation:drift 9s ease-in-out infinite alternate;}
    </style>
  </defs>

  <rect width="940" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="938" height="298" rx="15" fill="none" stroke="#7C3AED" stroke-opacity="0.35"/>

  <!-- aurora blooms -->
  <ellipse cx="180" cy="90" rx="260" ry="170" fill="url(#aurora)" filter="url(#glow)">
    <animate attributeName="rx" values="260;300;260" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="800" cy="230" rx="240" ry="160" fill="url(#aurora2)" filter="url(#glow)">
    <animate attributeName="rx" values="240;290;240" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- particle field -->
  <g fill="#ffffff">
    <g class="float">
      <circle class="star" cx="70"  cy="40"  r="1.6" style="animation-delay:0s"/>
      <circle class="star" cx="160" cy="230" r="1.3" style="animation-delay:.6s"/>
      <circle class="star" cx="260" cy="60"  r="1"   style="animation-delay:1.2s"/>
      <circle class="star" cx="420" cy="38"  r="1.4" style="animation-delay:.3s"/>
      <circle class="star" cx="540" cy="252" r="1.2" style="animation-delay:.9s"/>
      <circle class="star" cx="680" cy="48"  r="1.5" style="animation-delay:1.5s"/>
      <circle class="star" cx="760" cy="210" r="1"   style="animation-delay:.45s"/>
      <circle class="star" cx="880" cy="70"  r="1.3" style="animation-delay:1.1s"/>
      <circle class="star" cx="905" cy="180" r="1.1" style="animation-delay:.75s"/>
      <circle class="star" cx="360" cy="245" r="1"   style="animation-delay:1.8s"/>
      <circle class="star" cx="110" cy="150" r="1"   style="animation-delay:.2s"/>
      <circle class="star" cx="610" cy="232" r="1.2" style="animation-delay:1.35s"/>
    </g>
  </g>

  <!-- floating glyphs -->
  <g class="sub" font-size="16" fill="#7C3AED" fill-opacity="0.5">
    <text class="star" x="120" y="118" style="animation-delay:.4s">&lt;/&gt;</text>
    <text class="star" x="812" y="118" style="animation-delay:1.1s">{ }</text>
    <text class="star" x="300" y="262" style="animation-delay:.8s">=&gt;</text>
    <text class="star" x="660" y="266" style="animation-delay:1.6s">&#8734;</text>
  </g>

  <!-- name -->
  <text class="nm" x="470" y="110" text-anchor="middle" font-size="30" fill="#A78BFA" fill-opacity="0.35" filter="url(#soft)">JOÃO&#160;&#160;RICARDO</text>
  <text class="nm" x="470" y="110" text-anchor="middle" font-size="30" fill="url(#name)" letter-spacing="3">JOÃO&#160;&#160;RICARDO</text>
  <text class="nm" x="470" y="156" text-anchor="middle" font-size="52" fill="#A78BFA" fill-opacity="0.30" filter="url(#soft)">VAZ DE MELLO</text>
  <text class="nm" x="470" y="156" text-anchor="middle" font-size="52" fill="url(#name)" letter-spacing="2">VAZ DE MELLO</text>

  <!-- underline sweep -->
  <rect x="200" y="174" width="540" height="2" fill="url(#line)">
    <animate attributeName="width" values="0;540;540" keyTimes="0;0.6;1" dur="3s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x" values="470;200;200" keyTimes="0;0.6;1" dur="3s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text class="sub" x="470" y="200" text-anchor="middle" font-size="14" letter-spacing="2" fill="#C9D1D9">SOFTWARE ENGINEER&#160;&#160;·&#160;&#160;MOBILE &amp; FULL STACK</text>

  <!-- positioning hook -->
  <text class="sub" x="470" y="222" text-anchor="middle" font-size="13" letter-spacing="1" fill="#A78BFA">&#8220;I don&#8217;t ship features. I ship business outcomes.&#8221;</text>

  <!-- tag pills -->
  <g class="sub" font-size="12" text-anchor="middle">
    <g transform="translate(290,248)">
      <rect x="-66" y="0" width="132" height="26" rx="13" fill="#7C3AED" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="0" y="17" fill="#C9D1D9">Flutter · React Native</text>
    </g>
    <g transform="translate(470,248)">
      <rect x="-64" y="0" width="128" height="26" rx="13" fill="#EC4899" fill-opacity="0.14" stroke="#EC4899" stroke-opacity="0.55"/>
      <text x="0" y="17" fill="#C9D1D9">React · Next · Node · Go</text>
    </g>
    <g transform="translate(650,248)">
      <rect x="-58" y="0" width="116" height="26" rx="13" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="0" y="17" fill="#C9D1D9">Co-Founder @ LITS</text>
    </g>
  </g>
</svg>
